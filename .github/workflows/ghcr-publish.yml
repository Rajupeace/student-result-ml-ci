name: Publish Student Result image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train model and generate Docker inputs
        run: python train_model.py
      - name: Check ML quality gate
        run: python quality_gate.py
      - name: Run ML and API tests
        run: python -m unittest test_ml_pipeline.py test_app.py -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/rajupeace/student-result-prediction:ci
      - name: Run container health and prediction checks
        run: |
          docker run -d --name student-result-check -p 5000:5000 ghcr.io/rajupeace/student-result-prediction:ci
          trap 'docker logs student-result-check || true; docker rm -f student-result-check || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' http://localhost:5000/predict | tee prediction.json
          grep -q '"prediction"' prediction.json
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rajupeace/student-result-prediction:latest
            ghcr.io/rajupeace/student-result-prediction:v1
            ghcr.io/rajupeace/student-result-prediction:sha-${{ github.sha }}
